name: Prepare Android release

on:
  push:
    branches: [main]
    paths: [release/version.properties]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-android-release
  cancel-in-progress: false

jobs:
  detect:
    if: github.repository == 'rixerpixer007/Tumevaade' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: version
        run: node scripts/release-detect-android.mjs
      - name: Reject existing release tags
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/android-v$VERSION" --jq "map(select(.ref == \"refs/tags/android-v$VERSION\")) | length")
          test "$COUNT" = 0

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833"
          packages: platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run build:mobile:web
      - run: npm run validate
      - run: npm run validate:android
      - name: Build release APK without signing credentials
        run: node scripts/run-android-gradle.mjs :app:assembleRelease -PtumevaadeUnsignedRelease=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-android
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833"
          packages: build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-android
          path: .output/unsigned
      # Only this step receives the key/passwords. No npm install or Gradle runs here.
      - name: Sign APK and prepare verified release files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SINU_STUUDIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SINU_STUUDIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SINU_STUUDIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/sign-android-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: .output/release/android/*
          if-no-files-found: error

  draft:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release
          path: .output/release/android
      - name: Create draft with release notes and signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft-android.mjs
